<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Farm | AgriMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="container">
  <div class="page-head">
    <span class="eyebrow">Farmer dashboard</span>
    <h1>My farm</h1>
    <p class="muted">Manage your produce and the orders that come in.</p>
  </div>

  <div class="stats">
    <div class="stat"><b id="s-products">0</b><span>Active products</span></div>
    <div class="stat"><b id="s-orders">0</b><span>Order lines</span></div>
    <div class="stat"><b id="s-pending">0</b><span>Pending</span></div>
    <div class="stat"><b id="s-sales">KSh 0</b><span>Sales (not cancelled)</span></div>
  </div>

  <div class="dash-tabs">
    <button id="t-products" class="on" onclick="tab('products')">My products</button>
    <button id="t-orders" onclick="tab('orders')">Orders</button>
  </div>

  <section id="pane-products" style="padding-bottom:3rem">
    <div style="display:flex;justify-content:flex-end;margin-bottom:.8rem"><button class="btn btn-primary" onclick="openForm()">+ Add product</button></div>
    <div class="table-wrap"><table>
      <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
      <tbody id="products"></tbody>
    </table></div>
  </section>

  <section id="pane-orders" class="hidden" style="padding-bottom:3rem">
    <div class="table-wrap"><table>
      <thead><tr><th>Order</th><th>Date</th><th>Buyer</th><th>Item</th><th>Qty</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody id="orders"></tbody>
    </table></div>
  </section>
</main>

<div class="modal-bg" id="modal">
  <form class="modal" id="pform">
    <h2 style="font-size:1.4rem" id="mtitle">Add product</h2>
    <label for="p-name">Product name</label><input id="p-name" required>
    <div class="row-2">
      <div><label for="p-cat">Category</label><select id="p-cat"></select></div>
      <div><label for="p-icon">Emoji icon</label><input id="p-icon" maxlength="4" placeholder="🍅"></div>
    </div>
    <div class="row-2">
      <div><label for="p-price">Price (KSh)</label><input id="p-price" type="number" min="1" step="1" required></div>
      <div><label for="p-unit">Unit</label>
        <select id="p-unit"><option>kg</option><option>bunch</option><option>piece</option><option>bag</option><option>litre</option></select></div>
    </div>
    <div class="row-2">
      <div><label for="p-stock">Stock quantity</label><input id="p-stock" type="number" min="0" value="0" required></div>
      <div><label for="p-badge">Badge (optional)</label><input id="p-badge" placeholder="e.g. Fresh today"></div>
    </div>
    <label for="p-desc">Description</label><textarea id="p-desc" style="min-height:80px"></textarea>
    <div id="pmsg" class="form-msg"></div>
    <div style="display:flex;gap:.7rem;margin-top:1.2rem;justify-content:flex-end">
      <button type="button" class="btn btn-light" onclick="closeForm()">Cancel</button>
      <button class="btn btn-primary">Save product</button>
    </div>
  </form>
</div>
<div id="site-footer"></div>
<script src="js/app.js"></script>
<script>

initPage('dash');
if (guard('farmer')) start();

let editingId = null;
let myProducts = [];

function tab(t) {
  ['products', 'orders'].forEach((n) => {
    $('#pane-' + n).classList.toggle('hidden', n !== t);
    $('#t-' + n).classList.toggle('on', n === t);
  });
}

async function start() {
  const cats = await api('/categories');
  $('#p-cat').innerHTML = cats.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  loadProducts();
  loadOrders();
}

async function loadProducts() {
  myProducts = await api('/products/mine');
  const active = myProducts.filter((p) => p.is_active);
  $('#s-products').textContent = active.length;
  $('#products').innerHTML = myProducts.length ? myProducts.map((p) => `
    <tr>
      <td style="font-size:1.4rem">${esc(p.icon)}</td>
      <td><strong>${esc(p.name)}</strong></td>
      <td>${esc(p.category)}</td>
      <td>${money(p.price)} / ${esc(p.unit)}</td>
      <td>${p.stock_qty}</td>
      <td>${p.is_active ? '<span class="pill">Live</span>' : '<span class="pill bad">Removed</span>'}</td>
      <td>${p.is_active ? `<button class="btn btn-light btn-sm" onclick="openForm(${p.id})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="removeProduct(${p.id})">Remove</button>` : ''}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="muted">No products yet. Click “Add product”.</td></tr>';
}

async function loadOrders() {
  const rows = await api('/orders/farmer');
  const live = rows.filter((r) => r.status !== 'cancelled');
  $('#s-orders').textContent = rows.length;
  $('#s-pending').textContent = rows.filter((r) => r.status === 'pending').length;
  $('#s-sales').textContent = money(live.reduce((n, r) => n + r.unit_price * r.quantity, 0));
  $('#orders').innerHTML = rows.length ? rows.map((r) => `
    <tr>
      <td>#${r.id}</td><td>${fmtDate(r.created_at)}</td><td>${esc(r.buyer)}</td>
      <td>${esc(r.product)}</td><td>${r.quantity} ${esc(r.unit)}</td><td>${money(r.unit_price * r.quantity)}</td>
      <td><select onchange="setStatus(${r.id}, this.value)" style="padding:.35rem .6rem;width:auto">
        ${['pending', 'confirmed', 'delivered', 'cancelled'].map((s) => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}
      </select></td>
    </tr>`).join('') : '<tr><td colspan="7" class="muted">No orders yet.</td></tr>';
}

async function setStatus(id, status) {
  try { await api(`/orders/${id}/status`, { method: 'PATCH', body: { status } }); toast('Order updated'); loadOrders(); }
  catch (e) { toast(e.message); }
}

function openForm(id) {
  editingId = id || null;
  const p = myProducts.find((x) => x.id === id) || {};
  $('#mtitle').textContent = id ? 'Edit product' : 'Add product';
  $('#p-name').value = p.name || '';
  $('#p-cat').value = p.category_id || $('#p-cat').options[0].value;
  $('#p-icon').value = p.icon || '';
  $('#p-price').value = p.price ? Number(p.price) : '';
  $('#p-unit').value = p.unit || 'kg';
  $('#p-stock').value = p.stock_qty ?? 0;
  $('#p-badge').value = p.badge || '';
  $('#p-desc').value = p.description || '';
  $('#pmsg').className = 'form-msg';
  $('#modal').classList.add('open');
}
function closeForm() { $('#modal').classList.remove('open'); }

$('#pform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    name: $('#p-name').value, category_id: $('#p-cat').value, icon: $('#p-icon').value,
    price: $('#p-price').value, unit: $('#p-unit').value, stock_qty: $('#p-stock').value,
    badge: $('#p-badge').value, description: $('#p-desc').value
  };
  try {
    if (editingId) await api('/products/' + editingId, { method: 'PUT', body });
    else await api('/products', { method: 'POST', body });
    closeForm(); toast('Product saved'); loadProducts();
  } catch (err) { showMsg($('#pmsg'), err.message); }
});

async function removeProduct(id) {
  if (!confirm('Remove this product from the catalogue?')) return;
  try { await api('/products/' + id, { method: 'DELETE' }); toast('Product removed'); loadProducts(); }
  catch (e) { toast(e.message); }
}
</script>
</body>
</html>
