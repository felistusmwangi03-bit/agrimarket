<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Farmers | AgriMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="container">
  <div class="page-head">
    <span class="eyebrow">Meet the growers</span>
    <h1>Our farmers</h1>
    <p class="muted">Every farm on AgriMarket sells directly to you.</p>
  </div>
  <div class="grid-4" id="grid" style="padding-bottom:3rem"><p class="empty">Loading...</p></div>
</main>
<div id="site-footer"></div>
<script src="js/app.js"></script>
<script>

initPage('about');
api('/farmers').then((list) => {
  $('#grid').innerHTML = list.length ? list.map((f) => `
    <article class="farm-card">
      <div style="font-size:2rem">👩🏾‍🌾</div>
      <h3 style="margin:0">${esc(f.farm_name)}</h3>
      <span class="muted" style="font-size:.85rem">📍 ${esc(f.location)} · ${esc(f.owner)}</span>
      <p class="muted" style="font-size:.88rem;margin:.3rem 0">${esc(f.description)}</p>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto">
        ${f.verified ? '<span class="pill">✓ Verified</span>' : '<span class="pill warn">Pending</span>'}
        <a class="link-arrow" href="catalogue.html?search=${encodeURIComponent(f.farm_name)}">${f.product_count} product${f.product_count == 1 ? '' : 's'} →</a>
      </div>
    </article>`).join('') : '<p class="empty">No farmers yet.</p>';
}).catch((e) => ($('#grid').innerHTML = `<p class="empty">${esc(e.message)}</p>`));
</script>
</body>
</html>
